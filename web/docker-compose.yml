services:
  mongodb:
    image: mongo:8
    container_name: power_gym_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: power_gym_user
      MONGO_INITDB_ROOT_PASSWORD: power_gym_pass
      MONGO_INITDB_DATABASE: power_gym
    volumes:
      - mongo_data:/data/db

  minio:
    image: minio/minio:latest
    container_name: power_gym_minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (http://localhost:9001)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: power_gym_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/power-gym &&
      mc anonymous set public local/power-gym &&
      echo 'MinIO bucket ready'
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: power_gym_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP (e2e tests send here)
      - "8025:8025"   # Web UI  http://localhost:8025

volumes:
  mongo_data:
  minio_data:
